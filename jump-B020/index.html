, {"t": 731.7833333333333, "i": 683}, {"t": 732.0, "i": 684}, {"t": 733.5, "i": 685}, {"t": 734.05, "i": 686}, {"t": 735.0, "i": 687}, {"t": 736.5, "i": 688}, {"t": 738.0, "i": 689}, {"t": 738.9666666666667, "i": 690}, {"t": 739.5, "i": 691}, {"t": 741.0, "i": 692}, {"t": 742.5, "i": 693}, {"t": 743.1333333333333, "i": 694}, {"t": 744.0, "i": 695}, {"t": 745.5, "i": 696}, {"t": 746.4666666666667, "i": 697}], "subs": [{"t": 0.0, "x": "引用:久保帯人(著)「BLEACH」集英社\nテレビ東京/dentsu/\nぴえろ/KLabGames"}, {"t": 0.0, "x": "【ブリーチ】織姫の兄・井上昊、序盤に倒された\n虚1体で「虚とは何か」を全部背負わされていたに\n対する読者の反応集を紹介するよ！"}, {"t": 9.05, "x": "ぜひ最後まで見て\n高評価とコメント残してね！\nそれでは本編へどうぞ！"}, {"t": 13.966666666666667, "x": "井上昊、名前を出されても分からない人が\n多いと思うが、織姫の兄の方だ"}, {"t": 19.416666666666668, "x": "単行本の一巻に入ってる、\n六話の相手と言えば通じるだろ"}, {"t": 23.616666666666667, "x": "あのやたら重い回のやつか"}, {"t": 25.366666666666667, "x": "初めて読んだときは、まだ主人公の\n設定を把握しきれてない段階だからな"}, {"t": 30.483333333333334, "x": "そこにいきなりこの内容が来るので、\n頭が追いつかないまま読み終わる"}, {"t": 34.88333333333333, "x": "序盤も序盤に、あの内容を\n持ってきてるのが今考えると異常なんだよ"}, {"t": 39.11666666666667, "x": "連載が始まって一ヶ月かそこらの\n位置に置かれてるからな"}, {"t": 42.6, "x": "まだ主人公が刀の振り方も怪しい時期だぞ"}, {"t": 45.833333333333336, "x": "最初に用意された敵の一体が、実は\n作品の根っこを全部説明する役だった"}, {"t": 51.45, "x": "それをやらせるのに、ヒロインの身内を使ってきてる"}, {"t": 54.733333333333334, "x": "入り方が容赦ないんだよな"}, {"t": 56.68333333333333, "x": "新連載の掴みとしては、明るい方に\n振るのが普通の選び方だろ"}, {"t": 61.166666666666664, "x": "そこを外して、身内を送る話から\n入ってるのが最初の勝負手になってる"}, {"t": 66.08333333333333, "x": "今の目で読み返すと、あの一話で\n作品の骨組みが全部見えてしまう"}, {"t": 70.6, "x": "虚とは何か、死神は何をする者か、\n成仏とは何かが一度に説明されてる"}, {"t": 76.55, "x": "六話でそこまでやる必要あるか"}, {"t": 78.5, "x": "ただ、それを設定の\n説明としてではなく身内の\n話として出したのが上手い"}, {"t": 83.46666666666667, "x": "説明されてる感じが一切しないまま、\n読者が仕組みを覚えることになる"}, {"t": 88.31666666666666, "x": "教え方が上手いんだよこの回は"}, {"t": 90.4, "x": "仕組みの説明を、登場人物の事情に\n混ぜて出すのは書き手の腕が要る"}, {"t": 95.26666666666667, "x": "説明の頁が一枚も無いのに、\n読み終わると全部分かってるからな"}, {"t": 99.81666666666666, "x": "まず経歴を整理しておきたい。\n織姫より十五歳上の兄だ"}, {"t": 104.11666666666666, "x": "年が離れすぎてて、感覚としては\n兄というより親に近い"}, {"t": 108.1, "x": "十五は確かに大きい差だな"}, {"t": 109.93333333333334, "x": "上の子が下の子を育てる形になると、\n関係が親子に寄っていく"}, {"t": 114.06666666666666, "x": "呼び方は兄でも、実際の\n中身は保護者そのものなんだよ"}, {"t": 117.68333333333334, "x": "家の環境が良くなくて、\n二人とも親から酷い扱いを受けてる"}, {"t": 121.96666666666667, "x": "十八になった時点で、妹を\n連れて家を出たという流れになる"}, {"t": 126.25, "x": "十八で三歳の子を引き取ったのか"}, {"t": 128.66666666666666, "x": "働きながら一人で育ててるわけだから、\n負担の量が普通じゃない"}, {"t": 133.1, "x": "兄と親の役を同時にやってた\n期間があるということになる"}, {"t": 136.7, "x": "そこまで書いてあるのが凄いんだよ"}, {"t": 138.85, "x": "本編で扱われるのは数頁だが、\nそこに家庭の事情が全部詰め込まれてる"}, {"t": 144.1, "x": "言葉数を増やさずに、生活の\n重さだけ伝えてくる書き方だな"}, {"t": 148.55, "x": "ヒロインの家族構成を、序盤の\n敵の説明ついでに全部済ませてる"}, {"t": 152.78333333333333, "x": "一度の場面で二つを片付けてるんだよ"}, {"t": 155.16666666666666, "x": "構成が無駄なく組まれてる"}, {"t": 156.96666666666667, "x": "その兄が三年前に事故で亡くなってる"}, {"t": 159.61666666666667, "x": "作中の現在から見て三年前だから、\n織姫は中学生の頃になる"}, {"t": 164.6, "x": "一番きつい時期に一人になってるじゃないか"}, {"t": 167.35, "x": "生活の面倒を見てくれる相手が、\nある日いきなりいなくなる"}, {"t": 171.26666666666668, "x": "そこから一人で暮らしてるという事実が、\nさらっと書かれてるのが怖い"}, {"t": 175.71666666666667, "x": "しかも亡くなった日というのが、\n二人が初めて喧嘩をした日なんだよ"}, {"t": 180.05, "x": "それまで一度も\n言い争ったことがなかった、\nという書き方になってる"}, {"t": 184.45, "x": "最初の喧嘩がその日か"}, {"t": 186.0, "x": "一度も揉めたことのない兄妹と\nいう設定を、先に置いてあるのが効いてる"}, {"t": 190.76666666666668, "x": "だからその一回が、\n取り返しのつかない\n一回として立ち上がる"}, {"t": 194.95, "x": "喧嘩の原因が、兄が\n贈った髪飾りだったと\nいうのがまた効いてる"}, {"t": 199.4, "x": "花の形をしたあの髪飾りだ。ずっと付けてる方な"}, {"t": 203.35, "x": "あれ兄からの贈り物だったのか"}, {"t": 205.5, "x": "毎回描かれてる小物の由来が、\nこの回で説明されてる形になる"}, {"t": 210.3, "x": "以降ずっと画面に出続けるものに、\n意味を持たせてあるわけだ"}, {"t": 214.25, "x": "学校に付けていくのが\n恥ずかしい、という話でもめてる"}, {"t": 217.96666666666667, "x": "中学生としては、ごく普通のやり取りなんだよ"}, {"t": 221.18333333333334, "x": "どこの家でもある話だな"}, {"t": 222.86666666666667, "x": "特別な事情でも劇的な言い争いでもなく、\nただの気恥ずかしさから来てる"}, {"t": 227.95, "x": "そこが一番刺さる部分なんだよ。\n誰にでも心当たりがある"}, {"t": 232.25, "x": "その普通のやり取りが最後の会話になってしまう"}, {"t": 235.25, "x": "見送りの言葉を言えないまま別れることになる"}, {"t": 238.11666666666667, "x": "その状況は誰でも const a=document.getElementById('a'), v=document.getElementById('v');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
const src=i=>'f/'+String(i).padStart(4,'0')+'.jpg';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　カット'+D.n_cuts+'　字幕'+D.subs.length+'</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function seg(t){let lo=0,hi=D.segs.length-1,r=0;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.segs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-1;
function preload(i){for(let k=1;k<=4;k++){const s=D.segs[i+k]; if(s)new Image().src=src(s.i)}}
function paint(t){
  const i=seg(t);
  if(i!==cur){cur=i; v.src=src(D.segs[i].i);
    bdg.textContent='カット '+(i+1)+' / '+D.segs.length;
    mark('cuts',i); preload(i); }
  mark('subs',subIdx(t));
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b>'+fmt(s.t)+'</b><span></span>';
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
D.segs.forEach(s=>{const f=document.createElement('figure');
  f.innerHTML='<img loading="lazy" src="'+src(s.i)+'"><em>'+fmt(s.t)+'</em>';
  f.onclick=()=>go(s.t); document.getElementById('cuts').appendChild(f)});
const mk=document.getElementById('mk');
D.segs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,D.dur-0.05); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>go(D.segs[Math.max(0,seg(a.currentTime)-1)].t);
document.getElementById('nx').onclick=()=>go(D.segs[Math.min(D.segs.length-1,seg(a.currentTime)+1)].t);
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  document.getElementById('subs').hidden=b.dataset.p!=='subs';
  document.getElementById('cuts').hidden=b.dataset.p!=='cuts'});
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
