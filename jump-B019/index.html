 679}, {"t": 725.8666666666667, "i": 680}, {"t": 726.0, "i": 681}, {"t": 727.5, "i": 682}, {"t": 729.0, "i": 683}, {"t": 730.2833333333333, "i": 684}, {"t": 730.5, "i": 685}, {"t": 732.0, "i": 686}, {"t": 732.8166666666667, "i": 687}, {"t": 733.5, "i": 688}, {"t": 735.0, "i": 689}, {"t": 736.5, "i": 690}, {"t": 738.0, "i": 691}, {"t": 738.3333333333334, "i": 692}, {"t": 739.5, "i": 693}, {"t": 741.0, "i": 694}, {"t": 742.5, "i": 695}, {"t": 742.9, "i": 696}, {"t": 744.0, "i": 697}, {"t": 745.2833333333333, "i": 698}], "subs": [{"t": 0.0, "x": "引用:久保帯人(著)「BLEACH」集英社\nテレビ東京/dentsu/\nぴえろ/KLabGames"}, {"t": 0.0, "x": "【ブリーチ】ハリベルの扱い、勝ってもいないのに\n退場もしないまま終わったのは納得できないに\n対する読者の反応集を紹介するよ！"}, {"t": 8.183333333333334, "x": "ぜひ最後まで見て\n高評価とコメント残してね！\nそれでは本編へどうぞ！"}, {"t": 13.1, "x": "ティア・ハリベルの終わり方、\n改めて並べると相当に変な形なんだよ"}, {"t": 18.016666666666666, "x": "勝ってもいないし、倒されてもいない。\nどちらの決着もついてない"}, {"t": 22.633333333333333, "x": "中途半端のまま置かれてるわけか"}, {"t": 24.883333333333333, "x": "破面はほぼ全員、負けて画面から\n消えるという形で処理されてる"}, {"t": 29.35, "x": "その中でこの一人だけ、\n負けた場面のあとも話に残り続けてる"}, {"t": 34.016666666666666, "x": "残る理由が説明されないんだよな"}, {"t": 36.166666666666664, "x": "負けた側は消える、という決まりで\n動いてる集団の中では明らかに例外になる"}, {"t": 41.333333333333336, "x": "例外が一人いると、そこだけ読者の\n記憶に引っかかり続けるんだよ"}, {"t": 46.0, "x": "まず立ち位置から確認すると、\n第3十刃という上から三番目の位置だ"}, {"t": 50.95, "x": "番号としては上位で、下に\n七人ぶら下がってる格になる"}, {"t": 54.9, "x": "上澄みの一人ってことか"}, {"t": 56.61666666666667, "x": "上の三人は藍染の周りに置かれていて、\n他の七人とは扱いが分かれてる"}, {"t": 61.666666666666664, "x": "会議の場面でも、座ってる位置と\n喋る量がはっきり違うだろ"}, {"t": 65.81666666666666, "x": "そして破面篇の十刃の中で、\n女性はこの一人だけになる"}, {"t": 70.18333333333334, "x": "それだけでも画面での役割は\n大きくなるはずなんだよ"}, {"t": 73.51666666666667, "x": "数が少ない側は目立つからな"}, {"t": 75.41666666666667, "x": "しかも第3という枠は、以前に別の\n破面が持っていた番号でもある"}, {"t": 80.16666666666667, "x": "ネリエルが元の第3十刃だから、\nこの人はその後任にあたるわけだ"}, {"t": 85.01666666666667, "x": "帰刃の名前は皇鮫后。解放すると\n鮫を模した大剣を持つ姿になる"}, {"t": 91.0, "x": "扱うのは水で、刃で切ると\nいうより流れで押し切る戦い方だ"}, {"t": 95.2, "x": "水を使う破面ってのも珍しい"}, {"t": 97.55, "x": "破面の能力は獣や骨をかたどったものが\n多いから、水は系統として浮いてる"}, {"t": 103.03333333333333, "x": "絵として涼しいのも、他と並べたときに得をしてる"}, {"t": 106.6, "x": "高い水圧で相手を貫く技があって、\n断瀑という名前が付いてる"}, {"t": 111.15, "x": "水温まで操作できると\nいう設定があるのが、地味に強い"}, {"t": 114.96666666666667, "x": "温度を触れるのは反則寄りだろ"}, {"t": 116.83333333333333, "x": "高い温度と低い温度を両方使えるなら、\n対応できる相手の幅が広くなる"}, {"t": 121.96666666666667, "x": "攻める手と守る手が同じ能力の中に揃ってるんだよ"}, {"t": 125.63333333333334, "x": "実際、氷を使う相手の技を溶かして\n自分の水に変えてる場面がある"}, {"t": 130.31666666666666, "x": "相手の得意分野をそのまま奪う形になってるわけだ"}, {"t": 133.81666666666666, "x": "相性で優位に立ってるんだよな"}, {"t": 135.85, "x": "氷を出す相手に水を扱う側が\nぶつかると、素材を奪い合う形になる"}, {"t": 140.71666666666667, "x": "相手が作った氷が、そのままこちらの\n材料になってしまうからな"}, {"t": 145.15, "x": "対戦相手は日番谷冬獅郎。\n氷雪系の最強と言われてる側だ"}, {"t": 149.93333333333334, "x": "その相手に対して、\n押されるどころか主導権を握ってる"}, {"t": 153.66666666666666, "x": "そこで格の高さは十分に示されてる"}, {"t": 156.15, "x": "上位の破面が隊長格を\n押している場面は、\nそう多くはないからな"}, {"t": 160.65, "x": "その数少ない例のうちの一つを、\nこの人が担当してるわけだ"}, {"t": 164.91666666666666, "x": "描写だけ見れば、この戦いは順調に進んでる"}, {"t": 168.41666666666666, "x": "にもかかわらず、勝敗が付く前に別の要因で終わる"}, {"t": 172.03333333333333, "x": "そこが今日の本題になるわけだ"}, {"t": 174.18333333333334, "x": "戦いの途中で別の力が割り込んで終わる、\nという形は読者に不満が残る"}, {"t": 179.53333333333333, "x": "途中で電源が落ちた試合を見せられてる感じに近い"}, {"t": 182.86666666666667, "x": "先に従属官の話をしておきたい。三人いる"}, {"t": 186.43333333333334, "x": "アパッチ、ミラ・ローズ、\nスンスン。この三人が常に側にいる"}, {"t": 190.88333333333333, "x": "名前まで全員に付いてるのが珍しい"}, {"t": 193.13333333333333, "x": "従属官は名前も無く数だけ\n描かれることが多い立場だからな"}, {"t": 197.33333333333334, "x": "そこに三人ぶん、性格と喋り方まで\n割り振られてるのは厚遇だろ"}, {"t": 201.93333333333334, "x": "他の十刃にも従属官はいるが、\n三人揃って役割を持ってるのはここだけだ"}, {"t": 207.4, "x": "十刃の周りの人物で、名前と\n性格の両方が立ってる例は少ない"}, {"t": 212.26666666666668, "x": "それだけ手をかけられてるわけだ"}, {"t": 214.3, "x": "三人はそれぞれ武器も能力も違っていて、\n合体するとまた別の姿になる"}, {"t": 219.68333333333334, "x": "脇の扱いでそこまで\n用意されてる例は、\nこの作品でも少ない"}, {"t": 223.95, "x": "関係の作り方も他と違っていて、上下と\nいうより庇う側と庇われる側になってる"}, {"t": 229.71666666666667, "x": "戦わせたくないという意思が、\n行動の端々に出てるんだよ"}, {"t": 233.8, "x": "部下を const a=document.getElementById('a'), v=document.getElementById('v');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
const src=i=>'f/'+String(i).padStart(4,'0')+'.jpg';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　カット'+D.n_cuts+'　字幕'+D.subs.length+'</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function seg(t){let lo=0,hi=D.segs.length-1,r=0;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.segs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-1;
function preload(i){for(let k=1;k<=4;k++){const s=D.segs[i+k]; if(s)new Image().src=src(s.i)}}
function paint(t){
  const i=seg(t);
  if(i!==cur){cur=i; v.src=src(D.segs[i].i);
    bdg.textContent='カット '+(i+1)+' / '+D.segs.length;
    mark('cuts',i); preload(i); }
  mark('subs',subIdx(t));
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b>'+fmt(s.t)+'</b><span></span>';
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
D.segs.forEach(s=>{const f=document.createElement('figure');
  f.innerHTML='<img loading="lazy" src="'+src(s.i)+'"><em>'+fmt(s.t)+'</em>';
  f.onclick=()=>go(s.t); document.getElementById('cuts').appendChild(f)});
const mk=document.getElementById('mk');
D.segs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,D.dur-0.05); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>go(D.segs[Math.max(0,seg(a.currentTime)-1)].t);
document.getElementById('nx').onclick=()=>go(D.segs[Math.min(D.segs.length-1,seg(a.currentTime)+1)].t);
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  document.getElementById('subs').hidden=b.dataset.p!=='subs';
  document.getElementById('cuts').hidden=b.dataset.p!=='cuts'});
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
