": 680}, {"t": 733.5, "i": 681}, {"t": 735.0, "i": 682}, {"t": 735.8833333333333, "i": 683}, {"t": 736.5, "i": 684}, {"t": 738.0, "i": 685}, {"t": 739.5, "i": 686}, {"t": 740.8833333333333, "i": 687}, {"t": 741.0, "i": 688}, {"t": 742.5, "i": 689}, {"t": 744.0, "i": 690}, {"t": 744.1833333333333, "i": 691}, {"t": 745.5, "i": 692}, {"t": 746.4666666666667, "i": 693}, {"t": 747.0, "i": 694}, {"t": 748.5, "i": 695}, {"t": 750.0, "i": 696}, {"t": 750.9833333333333, "i": 697}, {"t": 751.5, "i": 698}, {"t": 753.0, "i": 699}, {"t": 754.5, "i": 700}, {"t": 755.3333333333334, "i": 701}, {"t": 756.0, "i": 702}, {"t": 757.5, "i": 703}, {"t": 759.0, "i": 704}, {"t": 760.4, "i": 705}], "subs": [{"t": 0.0, "x": "引用:久保帯人(著)「BLEACH」集英社\nテレビ東京/dentsu/\nぴえろ/KLabGames"}, {"t": 0.0, "x": "【ブリーチ】志波海燕「心は体の中には無え」\nに対する読者の反応集を紹介するよ！"}, {"t": 5.533333333333333, "x": "ぜひ最後まで見て\n高評価とコメント残してね！\nそれでは本編へどうぞ！"}, {"t": 10.45, "x": "十三番隊の元副隊長で、名前は志波海燕。\nまず出番の量から確認したいんだが"}, {"t": 16.783333333333335, "x": "本人が動いてるのは回想の中だけだ。\n現在の場面には一度も出てこない"}, {"t": 22.183333333333334, "x": "隊長は浮竹十四郎で、その下で\n隊の実務をほぼ握ってた人だろ"}, {"t": 26.983333333333334, "x": "現場を回してたのは完全にこっち側だな"}, {"t": 29.816666666666666, "x": "浮竹さんは体が弱くて臥せることが多いから、\n副隊長が前に出るのが常態になってた"}, {"t": 35.833333333333336, "x": "しかも志波家の当主だからな。\n家と隊の両方を背負ってる"}, {"t": 39.6, "x": "肩書きだけ並べると相当な重さだぞこれ"}, {"t": 42.583333333333336, "x": "家督と隊務を同時に持つと、\n普通はどちらかが疎かになるはずなんだよ"}, {"t": 47.36666666666667, "x": "両方きっちりやってた記録しか\n残ってないのがこの人だ"}, {"t": 51.083333333333336, "x": "当時は五大貴族の一角だ"}, {"t": 53.13333333333333, "x": "貴族の跡取りが自ら前線に立ってるのは、\nこの作品だと珍しい部類に入る"}, {"t": 58.766666666666666, "x": "朽木家の当主と並べると差がはっきりする。\nあっちは家の掟を先に立てる人だからな"}, {"t": 64.08333333333333, "x": "同じ貴族でも、片方は掟で動いて\n片方は現場で動いてるわけだ"}, {"t": 68.4, "x": "部下との距離の近さが全部そこから来てる"}, {"t": 71.18333333333334, "x": "敬語で近寄られるのを嫌がるタイプ"}, {"t": 73.41666666666667, "x": "口調が完全に下町の兄ちゃんなんだよな。\n貴族の当主の喋り方じゃない"}, {"t": 78.76666666666667, "x": "ルキアが入隊したとき、貴族だからって\n遠慮するなと言ったのがこの人だろ"}, {"t": 83.61666666666666, "x": "配属されたばかりの新人に対して、\n最初にやったのが距離を詰めることだった"}, {"t": 88.81666666666666, "x": "朽木家の妹を預かる立場だぞ。\n普通は腫れ物扱いになるところだ"}, {"t": 93.81666666666666, "x": "そこで普通に接した人が\n一人だけいた、という話になる"}, {"t": 97.4, "x": "一人だけってのがきついわ"}, {"t": 99.08333333333333, "x": "周りが全員よそよそしかったからこそ、\nこの人の態度が刺さったわけだ"}, {"t": 103.86666666666666, "x": "斬魄刀は捩花。槍のような形をしてる"}, {"t": 107.4, "x": "死神で槍を使う人自体が少ないから、\n絵として一発で覚えられる"}, {"t": 112.08333333333333, "x": "刀じゃない時点で目立つんだよな"}, {"t": 114.33333333333333, "x": "槍で戦う描写自体、作中だと\n数えるほどしかないだろ"}, {"t": 118.38333333333334, "x": "弟が志波岩鷲で、妹が志波空鶴。\nあの二人の兄がこの人だ"}, {"t": 123.15, "x": "弟妹の方が先に読者の前に出てるから、\n兄の話は後から追いつく形になってる"}, {"t": 128.46666666666667, "x": "順番が逆なんだよ紹介の"}, {"t": 130.51666666666668, "x": "岩鷲の性格を見てから兄を知ると、\n家の空気がなんとなく想像できるだろ"}, {"t": 135.61666666666667, "x": "黒崎一心が志波家の分家筋だと\nいう話も後から出てくる"}, {"t": 139.81666666666666, "x": "つまり主人公と血が繋がってる側の人だ。\n顔の作りが似てるのも偶然じゃない"}, {"t": 145.45, "x": "言われてみると口の悪さも似てる"}, {"t": 147.58333333333334, "x": "主人公の親戚筋が主人公より前に前線で\n戦ってた、という構図になるわけだ"}, {"t": 153.5, "x": "この家、当主が倒れて一心も消えて、\nそのまま五大貴族から外れてる"}, {"t": 158.08333333333334, "x": "一人抜けただけで家が傾くくらいには、\n支えてる比重が大きかったんだろ"}, {"t": 162.51666666666668, "x": "一人で持ってた家だったわけか"}, {"t": 164.55, "x": "出番は短いのに、設定の方は異様に\n厚く積まれてる人なんだよこれが"}, {"t": 169.41666666666666, "x": "その厚みが後で全部効いてくる"}, {"t": 171.55, "x": "妻の名前は志波都。\n同じ十三番隊で三席をやってた人だ"}, {"t": 176.4, "x": "夫婦で同じ隊に所属してるのは、\nこの作品だと他にほとんど例がない"}, {"t": 181.25, "x": "職場結婚どころの話じゃないわ"}, {"t": 183.6, "x": "同じ隊に家族を置くのは、指揮の\n面では本来やらない配置だからな"}, {"t": 187.75, "x": "隊長が浮竹、副隊長が海燕、三席が都。\n上から三人の並びがそのまま家族なんだよ"}, {"t": 195.1, "x": "その並びを崩したのがメタスタシアという虚だ"}, {"t": 198.13333333333333, "x": "名前の付いた虚が序盤から\n出てくること自体が珍しいだろ"}, {"t": 202.1, "x": "都はその虚に討たれて戻ってこなかった"}, {"t": 205.05, "x": "原作と映像化で経緯の描かれ方が\n少し違うから、そこは分けて話した方がいい"}, {"t": 210.6, "x": "アニメだと体を乗っ取られてるんだよな"}, {"t": 213.08333333333334, "x": "先に妻の姿で来て、そのあと夫の\n姿で来るという順番になってる"}, {"t": 218.01666666666668, "x": "どちらにしても、残ったのは遺体が\n戻らなかったという事実だけだ"}, {"t": 222.05, "x": "遺された側が一番きつい形だろこれ"}, {"t": 224.83333333333334, "x": "海燕はその虚を追いかけて、\n隊長の制止を振り切って出ていく"}, {"t": 229.1, "x": "浮竹さんが止めたのに行った、\nというところが後々まで効いてくる"}, {"t": 233.31666666666666, "x": "止められたのに行った側になるわけだ"}, {"t": 235.63333333333333, "x": "感情で動いた瞬間だけを切り取ると、\nこの人はここしか描かれてない"}, {"t": 240.3, "x": "普段が落ち着いてる分、\nあの一回が重く見えるんだよ"}, {"t": 243.73333333333332, "x": "冷静な人が一度だけ崩れる構成"}, {"t": 246.01666666666668, "x": "普段どれだけ落ち着いて見えても、\n身内のこととなると別だという話だ"}, {"t": 250.78333333333333, "x": "そして追いついた先で、体を取り込まれる"}, {"t": 253.68333333333334, "x": "倒すつもりで行った相手に、\n中身ごと持っていかれるわけだ"}, {"t": 257.4166666666667, "x": "一番やられたくない負け方だろそれ"}, {"t": 259.85, "x": "虚の側にしてみれば、副隊長格の\n体を手に入れたことになる"}, {"t": 264.3333333333333, "x": "しかも相手の記憶や顔まで込みで\n手に入る仕組みだから、質が悪い"}, {"t": 268.73333333333335, "x": "その体で仲間の前に戻ってくるからな"}, {"t": 271.5833333333333, "x": "姿は海燕のまま、中身は別のものになって帰ってくる"}, {"t": 275.26666666666665, "x": "これを序盤も序盤の回想でやってるのが、\nこの作品の性格を表してるわ"}, {"t": 280.3833333333333, "x": "味方の顔をした敵という形は\n後で何度も出てくるだろ"}, {"t": 284.03333333333336, "x": "最初にその型を持ち込んだのが\nこの一件だった、という見方はできる"}, {"t": 288.6333333333333, "x": "型の出所がここなんだよな"}, {"t": 290.68333333333334, "x": "ルキアはその場に居合わせた新人という位置だ"}, {"t": 293.45, "x": "隊長も副隊長も動けない状況で、\n残ったのが新人一人だった"}, {"t": 298.23333333333335, "x": "状況の作り方が容赦ないわ"}, {"t": 300.4, "x": "誰かが手を下さないと終わらない場面に、\n一番向いてない人が立たされてる"}, {"t": 304.85, "x": "ここからがこの回の本題になる"}, {"t": 307.06666666666666, "x": "ルキアが槍を持った海燕を貫いて、それで終わる"}, {"t": 310.3833333333333, "x": "新人が上司を、しかも一番世話になった\n相手を止める側に回るわけだ"}, {"t": 315.1333333333333, "x": "一巻分の重さがある場面だろ"}, {"t": 317.25, "x": "新人が最初の任務で\n背負うものとしては、\n明らかに規格外だぞこれ"}, {"t": 321.8666666666667, "x": "このとき海燕は自我を失ってる。\nだから当人の意思ではない"}, {"t": 326.0833333333333, "x": "にもかかわらず、最後の一瞬だけ意識が戻る"}, {"t": 329.31666666666666, "x": "その一瞬が全部を持っていく"}, {"t": 331.1333333333333, "x": "戻ったときに恨み言を一つも言わないのが、\nこの人の全部だと言っていい"}, {"t": 335.8666666666667, "x": "礼を言って終わるからな"}, {"t": 337.3333333333333, "x": "詫びの言葉まで入ってる。\n迷惑をかけたという言い方をしてるんだよ"}, {"t": 341.95, "x": "ありがとな、おかげで\n心はここに置いていける、\nという言い方をしてる"}, {"t": 346.3333333333333, "x": "置いていける、という言葉を選んでるのが上手い"}, {"t": 349.18333333333334, "x": "残す、じゃないんだよな"}, {" const a=document.getElementById('a'), v=document.getElementById('v');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
const src=i=>'f/'+String(i).padStart(4,'0')+'.jpg';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　カット'+D.n_cuts+'　字幕'+D.subs.length+'</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function seg(t){let lo=0,hi=D.segs.length-1,r=0;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.segs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-1;
function preload(i){for(let k=1;k<=4;k++){const s=D.segs[i+k]; if(s)new Image().src=src(s.i)}}
function paint(t){
  const i=seg(t);
  if(i!==cur){cur=i; v.src=src(D.segs[i].i);
    bdg.textContent='カット '+(i+1)+' / '+D.segs.length;
    mark('cuts',i); preload(i); }
  mark('subs',subIdx(t));
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b>'+fmt(s.t)+'</b><span></span>';
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
D.segs.forEach(s=>{const f=document.createElement('figure');
  f.innerHTML='<img loading="lazy" src="'+src(s.i)+'"><em>'+fmt(s.t)+'</em>';
  f.onclick=()=>go(s.t); document.getElementById('cuts').appendChild(f)});
const mk=document.getElementById('mk');
D.segs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,D.dur-0.05); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>go(D.segs[Math.max(0,seg(a.currentTime)-1)].t);
document.getElementById('nx').onclick=()=>go(D.segs[Math.min(D.segs.length-1,seg(a.currentTime)+1)].t);
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  document.getElementById('subs').hidden=b.dataset.p!=='subs';
  document.getElementById('cuts').hidden=b.dataset.p!=='cuts'});
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
