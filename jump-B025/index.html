異名は穀王で、霊王宮での持ち場は\n臥豚殿という食事を司る場所になる"}, {"t": 53.21666666666667, "x": "役割が食事と聞いた瞬間に、戦闘の話から\n外れるので語りにくくなるんだろうな"}, {"t": 59.13333333333333, "x": "担当している役目で損をしている"}, {"t": 61.35, "x": "零番隊は全員が隊長格の上に\n立つ存在なので、弱いということはあり得ない"}, {"t": 66.66666666666667, "x": "それでも強さ議論に呼ばれないのは、\n単に印象の入口が違うからだと言えるだろ"}, {"t": 71.96666666666667, "x": "話の入口が食事だからな"}, {"t": 74.15, "x": "零番隊そのものが千年血戦篇まで存在を\n伏せられていた集団なので、情報量が少ない"}, {"t": 79.96666666666667, "x": "霊王宮は王鍵が無いと行き来できない\n場所なので、そもそも登場の機会が限られる"}, {"t": 85.55, "x": "その中でも、戦っている絵が残っている人と\n残っていない人で差が付いている"}, {"t": 90.71666666666667, "x": "戦う絵があるかどうかで全部決まる"}, {"t": 93.01666666666667, "x": "派手に霊圧をぶつけ合う場面が無い人物は、\nどうしても語り口が用意されない"}, {"t": 98.13333333333334, "x": "一護たちが霊王宮へ運ばれる場面で、\n早い段階に顔を出しているのがこの人だぞ"}, {"t": 103.65, "x": "ところが経歴を並べると、この人の\n位置づけが一気に変わってくるわけだ"}, {"t": 108.46666666666667, "x": "最初に会う相手なのに印象が薄いと\nいうのが、そもそも妙な話になっている"}, {"t": 113.15, "x": "本編の百十年前、曳舟は護廷十三隊の\n十二番隊隊長を務めていた人物になる"}, {"t": 119.61666666666666, "x": "ここが一番驚かれるところだ"}, {"t": 121.78333333333333, "x": "しかも浦原喜助の先代で、つまり浦原が\n座る前の椅子に座っていたことになる"}, {"t": 127.33333333333333, "x": "歴代の十二番隊隊長という並びで\n語られる機会も、ほとんど用意されていない"}, {"t": 132.75, "x": "十二番隊といえば技術開発局の系譜で、\n後にマユリまで繋がっていく隊だからな"}, {"t": 138.5, "x": "浦原とマユリだけが十二番隊の顔として\n扱われているのが、今の状態だろ"}, {"t": 143.76666666666668, "x": "その系譜の源流にいる側だぞ"}, {"t": 146.15, "x": "百十年前の話には平子真子や猿柿ひよ里も\n出てくるので、面識がある間柄になる"}, {"t": 151.78333333333333, "x": "仮面の軍勢の面々と同じ時代を生きていて、\nそこから上に抜けた形になるわけだ"}, {"t": 157.53333333333333, "x": "上への抜け方が特殊すぎる"}, {"t": 159.53333333333333, "x": "浦原が隊長になったのは曳舟が零番隊へ\n上がった後なので、順番としてはこうなる"}, {"t": 165.31666666666666, "x": "百年前の一件で瀞霊廷が荒れる前に、\nこの人だけ先に上へ移っていたことになる"}, {"t": 171.13333333333333, "x": "結果として難を逃れている"}, {"t": 173.0, "x": "同じ時代を過ごした連中が現世に\n追放されている中で、位置の差が大きく開いた"}, {"t": 178.61666666666667, "x": "技術寄りの隊で女性が隊長を務めていたと\nいうのも、作中では珍しい部類に入る"}, {"t": 184.36666666666667, "x": "隊長が零番隊に引き上げられるというのは、\n作中でも数えるほどしか例が無い"}, {"t": 189.01666666666668, "x": "しかも戦功ではなく、作ったものが\n評価されての抜擢という説明が付いている"}, {"t": 194.33333333333334, "x": "評価された功績の種類が違う"}, {"t": 196.66666666666666, "x": "斬った数でも守った数でもなく、技術を\n作った実績で王宮に呼ばれているんだよ"}, {"t": 202.25, "x": "死神の世界で技術者が最上位に上がった\n例としては、相当に珍しい部類に入る"}, {"t": 208.08333333333334, "x": "浦原の先を行っていた側だぞ"}, {"t": 210.21666666666667, "x": "浦原も研究で名を上げた側だが、こちらは\n先に同じ道で上まで行っているからな"}, {"t": 215.78333333333333, "x": "その功績の中身が、義魂と\nいう考え方とそれを体に\n入れる技術という話になる"}, {"t": 221.85, "x": "ここからが本題になるところだ"}, {"t": 223.95, "x": "仮の魂を作って、それを体に取り込ませる。\nこの二つを形にしたのが曳舟だ"}, {"t": 229.63333333333333, "x": "死神が現世で使う義魂丸は、この技術を\n応用して作られたものという流れになる"}, {"t": 235.41666666666666, "x": "作品の初期から画面に出ている道具だ"}, {"t": 238.05, "x": "一護が最初に浦原商店で受け取った\nあの粒も、元をたどるとここに行き着く"}, {"t": 243.18333333333334, "x": "義魂丸は現世で活動するための\n必需品として、作中で何度も画面に出てくる"}, {"t": 248.93333333333334, "x": "主人公が現世で行動するための仕組みが、\nこの人の研究の上に乗っているわけだ"}, {"t": 254.55, "x": "仕組みの土台を作った側だぞ"}, {"t": 256.55, "x": "義魂丸が無ければ、死神が体を抜けて\n戦うくだりが全部やりにくくなっていた"}, {"t": 262.1, "x": "使われた回数で数えたら、作中でも屈指の\n登場頻度を持つ道具になるだろこれは"}, {"t": 267.26666666666665, "x": "体を置いていくという発想そのものが、\nこの技術の上でしか成立しないからな"}, {"t": 272.55, "x": "話の前提そのものを作っている"}, {"t": 274.9166666666667, "x": "現世に居ながら死神として動くと\nいう形が、そもそもここから始まっているぞ"}, {"t": 280.35, "x": "物語を動かすための道具を用意した人物が、\n本人はほとんど画面に出てこない"}, {"t": 285.8666666666667, "x": "裏方に徹しすぎているだろこれは"}, {"t": 288.15, "x": "改造魂魄という発想も、この義魂の\n技術の延長線上にあるという繋がりになる"}, {"t": 294.1166666666667, "x": "コンが入っているあの粒も、系譜としては\n同じ場所から出てきたことになるわけだ"}, {"t": 299.21666666666664, "x": "この繋がりに気づくと面白い"}, {"t": 301.23333333333335, "x": "第一話の近くから画面に出ている道具の\n出所が、最終章の人物だという構図だぞ"}, {"t": 306.6, "x": "道具の知名度と作った人物の知名度が、\nここまで離れている例も珍しいところだ"}, {"t": 312.35, "x": "伏線と呼ぶには遠すぎる距離なんだが、\n繋がっていること自体が気持ちいい"}, {"t": 317.18333333333334, "x": "回収されるまでが遅すぎるだろ"}, {"t": 319.3333333333333, "x": "浦原の商品として説明されていたものが、\n実は先代の仕事だったという話になる"}, {"t": 325.3833333333333, "x": "発明が有名になるほど作った人の名前が\n消えるのは、現実の話でも変わらない"}, {"t": 331.06666666666666, "x": "浦原が改造魂魄の計画に関わっていた件も、\n土台の技術があってこそ成立している"}, {"t": 337.3, "x": "浦原が一人で作ったわけではない"}, {"t": 339.56666666666666, "x": "技術の系譜という視点で読むと、\n十二番隊の歴史が一本の線で繋がってくる"}, {"t": 344.53333333333336, const a=document.getElementById('a'), v=document.getElementById('v');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
const src=i=>'f/'+String(i).padStart(4,'0')+'.jpg';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　カット'+D.n_cuts+'　字幕'+D.subs.length+'</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function seg(t){let lo=0,hi=D.segs.length-1,r=0;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.segs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-1;
function preload(i){for(let k=1;k<=4;k++){const s=D.segs[i+k]; if(s)new Image().src=src(s.i)}}
function paint(t){
  const i=seg(t);
  if(i!==cur){cur=i; v.src=src(D.segs[i].i);
    bdg.textContent='カット '+(i+1)+' / '+D.segs.length;
    mark('cuts',i); preload(i); }
  mark('subs',subIdx(t));
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b>'+fmt(s.t)+'</b><span></span>';
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
D.segs.forEach(s=>{const f=document.createElement('figure');
  f.innerHTML='<img loading="lazy" src="'+src(s.i)+'"><em>'+fmt(s.t)+'</em>';
  f.onclick=()=>go(s.t); document.getElementById('cuts').appendChild(f)});
const mk=document.getElementById('mk');
D.segs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,D.dur-0.05); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>go(D.segs[Math.max(0,seg(a.currentTime)-1)].t);
document.getElementById('nx').onclick=()=>go(D.segs[Math.min(D.segs.length-1,seg(a.currentTime)+1)].t);
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  document.getElementById('subs').hidden=b.dataset.p!=='subs';
  document.getElementById('cuts').hidden=b.dataset.p!=='cuts'});
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
