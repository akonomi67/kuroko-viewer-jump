目に置いた理由も、\n作中でははっきりとは語られていない"}, {"t": 75.35, "x": "本人が愛という言葉を繰り返すので、\nそこだけは強く印象に残っている読者も多い"}, {"t": 81.08333333333333, "x": "敵側で愛を語る人物は他にもいるんだが、\n意味の使い方がそれぞれ違うのが面白い"}, {"t": 87.0, "x": "同じ言葉で別のことを言っている"}, {"t": 89.2, "x": "話題に出るとしても能力の紹介止まりで、\n戦い方まで踏み込まれた例が少ない"}, {"t": 94.73333333333333, "x": "十刃の中で単独の回想が用意されていないのも、\n印象が薄くなる理由の一つだろうな"}, {"t": 100.8, "x": "第七という番号のせいで、強さ議論の\n卓にすら乗せてもらえていないところがある"}, {"t": 106.11666666666666, "x": "番号の印象だけで判断されている"}, {"t": 108.56666666666666, "x": "虚夜宮での配置も奥まっていて、\n侵入した側と当たるまでに時間がかかっている"}, {"t": 113.5, "x": "先にノイトラやザエルアポロが暴れているので、\n順番としても不利な位置に立つ"}, {"t": 118.45, "x": "破面篇は敵の頭数が多いので、一人あたりに\n割ける枚数がどうしても限られてくる"}, {"t": 124.36666666666666, "x": "登場の順番が悪い"}, {"t": 125.91666666666667, "x": "ところが持っているものを並べ直すと、\n数字の印象とはまったく釣り合わないぞ"}, {"t": 130.86666666666667, "x": "まず基礎の部分として、響転の速さが\n破面の中で最も上だと作中で語られている"}, {"t": 136.98333333333332, "x": "響転は死神でいう瞬歩に当たる移動術で、\n速さがそのまま生存率に直結する"}, {"t": 142.83333333333334, "x": "移動が速い時点で相当に厄介だぞ"}, {"t": 145.45, "x": "十刃の中で最速という肩書きは、序列の\n下の方が持つには重すぎる看板だろ"}, {"t": 150.71666666666667, "x": "上位の連中が力押しで組み立てられているのに\n対して、こっちは速度で組んである"}, {"t": 156.03333333333333, "x": "組み立ての方向がそもそも違う"}, {"t": 158.3, "x": "さらに双児響転という技があって、\n分身しているように見える動きまでできる"}, {"t": 162.91666666666666, "x": "残像ではなく実体が二つに見える形で\n相手を挟むので、対処の手が一段増える"}, {"t": 168.66666666666666, "x": "速さで押して視界を取り、そこから能力を通す。\n順番がきちんと組まれているんだよ"}, {"t": 174.48333333333332, "x": "動きと能力が噛み合っている"}, {"t": 176.4, "x": "速度型は作中でも強い部類に入るので、\nそれだけでも上位と戦える土台はある"}, {"t": 181.96666666666667, "x": "夜一の瞬神と比べる話にはならないにせよ、\n破面側で最速という位置は大きい"}, {"t": 187.25, "x": "速さは数字で出る類の力ではないので、\n最速という言葉だけが根拠として残る形だ"}, {"t": 193.51666666666668, "x": "並べる相手がそもそも少ない"}, {"t": 195.53333333333333, "x": "速さを持っている敵は、逃げに使うか\n奇襲に使うかで役割が分かれるところがある"}, {"t": 200.91666666666666, "x": "ゾマリの場合はどちらでもなく、\n能力を通すための下ごしらえに使っているわけだ"}, {"t": 206.13333333333333, "x": "使い道が地味に賢い"}, {"t": 207.83333333333334, "x": "その上で本命の能力が来るので、紹介の\n順番としては相当に贅沢な構成になる"}, {"t": 213.83333333333334, "x": "帰刃の名前が呪眼僧伽で、解放すると\n全身が目に覆われた異形の姿に変わる"}, {"t": 219.68333333333334, "x": "絵面の圧がとにかく強いんだよ"}, {"t": 221.8, "x": "腕も胴も脚も目だらけになるので、初見の\n気持ち悪さでは十刃でも上の方に入る"}, {"t": 226.96666666666667, "x": "僧伽という言葉は僧の集まりを指すので、\n名前の付け方も宗教の側に寄せてある"}, {"t": 232.6, "x": "破面の中では珍しい方向だ"}, {"t": 235.03333333333333, "x": "その目のひとつひとつが能力の本体で、\n見つめた相手の体を支配する仕組みだ"}, {"t": 240.4, "x": "支配は体ごとではなく部位ごとで、\n右腕だけ、左足だけという単位で奪っていく"}, {"t": 246.15, "x": "丸ごとではなく分けて取れるのが怖い"}, {"t": 248.51666666666668, "x": "一つの目で一つの対象を押さえるので、\n目の数がそのまま同時に扱える数になる"}, {"t": 254.03333333333333, "x": "その目が五十を超えるので、理屈の上では\n五十か所を同時に押さえられる計算だぞ"}, {"t": 259.26666666666665, "x": "多すぎて数える気が失せるだろ"}, {"t": 261.23333333333335, "x": "射程は十メートル前後と説明されていて、\n間合いも決して短い方ではない"}, {"t": 265.76666666666665, "x": "そして条件が、視界に\n入れて見つめることだけだ。\nここが一番おかしいところだろ"}, {"t": 271.48333333333335, "x": "触れる必要も、名前を呼ぶ必要も、\n時間をかけて仕込む必要も一切無い"}, {"t": 276.68333333333334, "x": "前置きが一つも要らないんだよ"}, {"t": 278.65, "x": "相手を操る能力というのは、普通は代償か\n条件を重くして釣り合いを取るものだろ"}, {"t": 284.15, "x": "他の漫画で似た力を見ても、触れるか、\n名前を知るか、契約を結ぶかのどれかが要る"}, {"t": 290.26666666666665, "x": "一定の時間見つめ続けるとか、相手の同意を\n必要とするとか、必ず縛りが入るわけだ"}, {"t": 296.6, "x": "縛りを外すと話の方が壊れる"}, {"t": 298.96666666666664, "x": "操る側が強すぎると戦いの筋が消えるので、\n作る側は必ずどこかに枷を付ける"}, {"t": 304.3666666666667, "x": "使用回数を絞るか、\n対象の格に制限をかけるか、\n解除の条件を用意するかになる"}, {"t": 310.53333333333336, "x": "その辺りが定番の処理だ"}, {"t": 312.3833333333333, "x": "その中に並べると、見ただけで成立すると\nいうのはかなり軽い部類に入ってしまう"}, {"t": 317.8333333333333, "x": "同じ作品の中で比べても、ペペの能力は\n矢を当てるという工程が挟まっている"}, {"t": 323.3666666666667, "x": "藍染の完全催眠にしても、一度は刀を\n相手に見せておく必要があるからな"}, {"t": 328.68333333333334, "x": "どれも先に手間を払わされている"}, {"t": 330.8666666666667, "x": "ジゼルの側にしても、血を浴びせると\nいう手順を踏まないと支配が始まらない"}, {"t": 335.6, "x": "BLEACHは操作系と幻覚系が\n多い作品なんだが、大抵は\n前工程が用意されている"}, {"t": 340.51666666666665, "x": "その中で一番手が少ない"}, {"t": 342.26666666666665, "x": "ゾマリだけが前払いを何もしていないので、\n発動までの手数が単純に短い"}, {"t": 347.53333333333336, "x": "支配した部位はそのまま自分の指示で\n動くので、相手の武器を奪う形にもなる"}, {"t": 352.6333333333333, "x": "相手の攻撃手段ごと取り上げられる"}, {"t": 355.03333333333336, "x": "腕を押さえれば刀が振れなくなり、\n足を押さえればその場から動けな const a=document.getElementById('a'), v=document.getElementById('v');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
const src=i=>'f/'+String(i).padStart(4,'0')+'.jpg';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　カット'+D.n_cuts+'　字幕'+D.subs.length+'</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function seg(t){let lo=0,hi=D.segs.length-1,r=0;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.segs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-1;
function preload(i){for(let k=1;k<=4;k++){const s=D.segs[i+k]; if(s)new Image().src=src(s.i)}}
function paint(t){
  const i=seg(t);
  if(i!==cur){cur=i; v.src=src(D.segs[i].i);
    bdg.textContent='カット '+(i+1)+' / '+D.segs.length;
    mark('cuts',i); preload(i); }
  mark('subs',subIdx(t));
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b>'+fmt(s.t)+'</b><span></span>';
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
D.segs.forEach(s=>{const f=document.createElement('figure');
  f.innerHTML='<img loading="lazy" src="'+src(s.i)+'"><em>'+fmt(s.t)+'</em>';
  f.onclick=()=>go(s.t); document.getElementById('cuts').appendChild(f)});
const mk=document.getElementById('mk');
D.segs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,D.dur-0.05); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>go(D.segs[Math.max(0,seg(a.currentTime)-1)].t);
document.getElementById('nx').onclick=()=>go(D.segs[Math.min(D.segs.length-1,seg(a.currentTime)+1)].t);
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  document.getElementById('subs').hidden=b.dataset.p!=='subs';
  document.getElementById('cuts').hidden=b.dataset.p!=='cuts'});
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
